<!doctype html>
<html lang="sv">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#202124" media="(prefers-color-scheme: dark)" />
		<meta name="description" content="Personligt schema för Klanglandets volontärer" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png">
		<script>
			// Apply a saved theme choice before first paint, so there is no flash.
			// Keep in sync with src/lib/theme.ts.
			try {
				var t = localStorage.getItem('klanghan:theme');
				if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
			} catch (e) {}
		</script>
		%sveltekit.head%

	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
