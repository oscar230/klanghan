kind: pipeline
type: docker
name: default

steps:
- name: generate-tags
  image: node:alpine
  commands:
    - VERSION=$(node -p "require('./package.json').version")
    - echo "latest,$VERSION" > .tags

- name: publish
  image: plugins/docker
  settings:
    registry: ghcr.io
    repo: ghcr.io/oscar230/klanghan
    username:
      from_secret: REGISTRY_USER
    password:
      from_secret: REGISTRY_PASSWORD
  when:
    branch:
      - main
    event:
      - push
