kind: pipeline
type: docker
name: default

platform:
  os: linux
  arch: arm64

trigger:
  branch:
    - main

steps:
  - name: prepare-build-web
    image: alpine:3
    environment:
      BASE_URL:
        from_secret: api_base_url
    commands:
      - echo "PUBLIC_API_BASE_URL=${BASE_URL}" > web/.env
      - cat web/.env

  - name: compress-images-web
    image: python:3-alpine
    commands:
      - pip3 install pillow optimize-images
      - optimize-images ./web -jobs 16

  - name: remove-exif-web
    image: alpine:3
    commands:
      - apk update && apk add exiftool
      - exiftool -all:all= -r ./ -overwrite_original
    depends_on:
    - compress-images-web

  - name: build-and-push-web
    image: plugins/docker
    settings:
      registry: registry.e012.se
      username:
        from_secret: registry_username
      password:
        from_secret: registry_password
      repo: registry.e012.se/oscar230/klanghan-web
      tags: "${DRONE_SOURCE_BRANCH}"
      dockerfile: web/Dockerfile
      context: web
      force_tag: false
      purge: true
    depends_on:
    - prepare-build-web
    - remove-exif-web

  - name: build-and-push-api
    image: plugins/docker
    settings:
      registry: registry.e012.se
      username:
        from_secret: registry_username
      password:
        from_secret: registry_password
      repo: registry.e012.se/oscar230/klanghan-api
      tags: "${DRONE_SOURCE_BRANCH}"
      dockerfile: api/Dockerfile
      context: api
      force_tag: false
      purge: true

  - name: deploy
    image: alpine:3
    environment:
      WATCHTOWER_HOST:
        from_secret: watchtower-host
      WATCHTOWER_AUTH_TOKEN:
        from_secret: watchtower-token
    commands:
      - apk add --no-cache curl
      - |
        curl -H "Authorization: Bearer $WATCHTOWER_AUTH_TOKEN" "https://$WATCHTOWER_HOST/v1/update"
    depends_on:
    - build-and-push-web
    - build-and-push-api
    when:
      status:
        - success