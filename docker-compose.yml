version: '3.8'

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: klanghan
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    volumes:
      - ./api/config.yml:/config.yml
    ports:
      - "5200:5200"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        - PUBLIC_API_BASE_URL=http://localhost:5200
    environment:
      - PUBLIC_API_BASE_URL=http://localhost:5200
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
