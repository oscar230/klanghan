version: '3.8'

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: klanghan
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: klanghan
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U klanghan -d klanghan"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
